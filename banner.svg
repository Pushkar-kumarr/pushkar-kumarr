    <text x="500" y="168" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" fill="#ffffff" fill-opacity="0.85">Full-stack developer · AI &amp; cloud projects
      <animate attributeName="opacity" from="0" to="0.85" begin="0.6s" dur="1.2s" fill="freeze"/>
