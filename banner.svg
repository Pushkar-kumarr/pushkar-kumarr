      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <clipPath id="round"><rect width="1000" height="250" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
